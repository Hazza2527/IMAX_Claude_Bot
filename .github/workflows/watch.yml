name: IMAX Dune Watcher

# GitHub's scheduled runs are capped at every 5 minutes and are routinely
# delayed 10-20 minutes under load, which is far too slow for a surprise ticket
# drop. So instead of relying on cron, one job polls in a loop for ~5h40m (the
# job cap is 6h) and dispatches its own successor before exiting. That gives a
# continuous ~45 second check with no cron jitter.

on:
  workflow_dispatch:
  schedule:
    # Watchdog only — the chain re-arms itself. This exists to restart things
    # if a run is ever killed before it can dispatch its successor, which does
    # happen: hosted runners occasionally fail to be acquired at all.
    - cron: "*/30 * * * *"

permissions:
  contents: write # commit state.json
  actions: write # list runs, and dispatch the next one in the chain

# NOTE: deliberately no `concurrency:` block. It enforces one-at-a-time by
# *cancelling* the redundant run, and every cancellation sends a failure
# notification. The guard step below does the same job by exiting cleanly
# instead, so redundant runs finish green and silently.

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Skip if another poller is already running
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any *older* in-flight run wins. Comparing run ids breaks the tie
          # deterministically, so two runs starting together can't both proceed.
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow watch.yml \
                     --status in_progress --limit 50 --json databaseId \
                     --jq "[.[] | select(.databaseId < ${{ github.run_id }})] | length")
          echo "older pollers in flight: $others"
          if [ "$others" -gt 0 ]; then
            echo "Another poller owns this shift — exiting quietly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install --quiet requests beautifulsoup4

      - name: Configure git for state commits
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name  "imax-watcher[bot]"
          git config user.email "imax-watcher[bot]@users.noreply.github.com"

      - name: Watch
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py --send --commit --minutes 340

      # always(), so a crashed or timed-out poll still hands over. Skipped runs
      # must NOT re-arm, or a guard exit would spawn a replacement immediately.
      - name: Start the next run
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref ${{ github.ref_name }}
