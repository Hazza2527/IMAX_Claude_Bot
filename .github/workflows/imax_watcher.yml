name: IMAX Melbourne Ticket Watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write             # needed so the workflow can commit state.json

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python imax_watcher.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name  "imax-watcher[bot]"
          git config user.email "imax-watcher[bot]@users.noreply.github.com"
          git pull --rebase
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update watcher state"
          git push