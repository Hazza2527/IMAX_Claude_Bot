name: IMAX Melbourne Queue-it Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Queue-it watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python queueit_watcher.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name  "imax-watcher[bot]"
          git config user.email "imax-watcher[bot]@users.noreply.github.com"
          git add queueit_state.json
          git diff --cached --quiet || git commit -m "chore: update queueit watcher state"
          git push --force
